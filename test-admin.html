<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Test - Rum River Admin</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #login {
            background: #667eea;
            color: white;
        }
        
        #login:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        #test {
            background: #48bb78;
            color: white;
        }
        
        #test:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }
        
        #logout {
            background: #f56565;
            color: white;
        }
        
        #logout:hover {
            background: #e53e3e;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 101, 101, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .status.show {
            display: block;
        }
        
        .status.info {
            background: #bee3f8;
            color: #2c5282;
            border: 1px solid #90cdf4;
        }
        
        .status.success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }
        
        .status.error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }
        
        #result {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
        
        #result.show {
            display: block;
        }
        
        .user-info {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        
        .user-info.show {
            display: block;
        }
        
        .user-info h3 {
            color: #22543d;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .user-info p {
            color: #2f855a;
            font-size: 16px;
            font-weight: 600;
        }
        
        .instructions {
            background: #fef5e7;
            border: 1px solid #f9e79f;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #7e5109;
        }
        
        .instructions h3 {
            margin-bottom: 10px;
            color: #7e5109;
        }
        
        .instructions ol {
            margin-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Authentication Test</h1>
        <p class="subtitle">Rum River Wedding Barn - Admin System</p>
        
        <div class="instructions">
            <h3>📋 Quick Start:</h3>
            <ol>
                <li>Click "Login" to authenticate with Netlify Identity</li>
                <li>Use your email to sign in (or sign up if first time)</li>
                <li>Click "Test Auth" to verify the authentication works</li>
                <li>Click "Logout" when done</li>
            </ol>
        </div>
        
        <div id="userInfo" class="user-info">
            <h3>Logged in as:</h3>
            <p id="userEmail">-</p>
        </div>
        
        <div id="status" class="status"></div>
        
        <div class="button-group">
            <button id="login">🔑 Login</button>
            <button id="test">🧪 Test Auth</button>
            <button id="logout">🚪 Logout</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        // Initialize Netlify Identity with site URL
        netlifyIdentity.init({
            APIUrl: 'https://rumrivermn.com/.netlify/identity'  // Replace with your actual site URL
        });
        
        // IMPORTANT: Also add this to handle the confirmation
        if (window.location.hash && window.location.hash.includes('confirmation_token')) {
            netlifyIdentity.init();
        }
        
        // UI Elements
        const loginBtn = document.getElementById('login');
        const testBtn = document.getElementById('test');
        const logoutBtn = document.getElementById('logout');
        const resultDiv = document.getElementById('result');
        const statusDiv = document.getElementById('status');
        const userInfoDiv = document.getElementById('userInfo');
        const userEmailSpan = document.getElementById('userEmail');
        
        // Helper function to show status
        function showStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `status show ${type}`;
            setTimeout(() => {
                statusDiv.classList.remove('show');
            }, 5000);
        }
        
        // Helper function to update UI based on auth state
        function updateUI() {
            const user = netlifyIdentity.currentUser();
            
            if (user) {
                userInfoDiv.classList.add('show');
                userEmailSpan.textContent = user.email;
                loginBtn.disabled = true;
                testBtn.disabled = false;
                logoutBtn.disabled = false;
                showStatus('✅ You are logged in!', 'success');
            } else {
                userInfoDiv.classList.remove('show');
                userEmailSpan.textContent = '-';
                loginBtn.disabled = false;
                testBtn.disabled = true;
                logoutBtn.disabled = true;
                resultDiv.classList.remove('show');
            }
        }
        
        // Login handler
        loginBtn.onclick = () => {
            netlifyIdentity.open();
        };
        
        // Logout handler
        logoutBtn.onclick = () => {
            netlifyIdentity.logout();
            showStatus('👋 Logged out successfully', 'info');
            resultDiv.classList.remove('show');
        };
        
        // Test authentication handler
        testBtn.onclick = async () => {
            const user = netlifyIdentity.currentUser();
            if (!user) {
                showStatus('⚠️ You must be logged in first', 'error');
                return;
            }
            
            try {
                showStatus('🔄 Testing authentication...', 'info');
                
                // Get JWT token
                const token = await user.jwt();
                
                // Call the Netlify Function
                const response = await fetch('/.netlify/functions/test-auth', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showStatus('✅ Authentication test successful!', 'success');
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                    resultDiv.classList.add('show');
                } else {
                    showStatus(`❌ Authentication failed: ${data.error}`, 'error');
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                    resultDiv.classList.add('show');
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                resultDiv.textContent = `Error: ${error.message}`;
                resultDiv.classList.add('show');
            }
        };
        
        // Listen for auth changes
        netlifyIdentity.on('login', user => {
            console.log('User logged in:', user);
            updateUI();
            netlifyIdentity.close();
        });
        
        netlifyIdentity.on('logout', () => {
            console.log('User logged out');
            updateUI();
        });
        
        netlifyIdentity.on('error', err => {
            console.error('Netlify Identity error:', err);
            showStatus(`❌ Authentication error: ${err}`, 'error');
        });
        
        // Initial UI update
        updateUI();
    </script>
</body>
</html>
