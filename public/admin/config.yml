backend:
  name: git-gateway
  branch: master

# Local development
local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Site configuration
site_url: https://rumriverweddingbarn.com
display_url: https://rumriverweddingbarn.com
logo_url: /images/logo.png

collections:
  # Pages Collection - Individual page content
  - name: "pages"
    label: "📄 Pages"
    files:
      - name: "home"
        label: "🏠 Home Page"
        file: "content/pages/home.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Script Accent", name: "scriptAccent", widget: "string", default: "Where Dreams Begin"}
              - {label: "Main Title Line 1", name: "titleLine1", widget: "string", default: "Rum River"}
              - {label: "Main Title Line 2", name: "titleLine2", widget: "string", default: "Wedding Barn"}
              - {label: "Description", name: "description", widget: "text", default: "Nestled along Minnesota's scenic Rum River, our historic barn offers the perfect blend of rustic charm and modern elegance for your once-in-a-lifetime celebration."}
              - {label: "Background Image", name: "backgroundImage", widget: "image"}
              - {label: "CTA Button Text", name: "ctaText", widget: "string", default: "Schedule Your Visit"}
              - {label: "CTA Button Link", name: "ctaLink", widget: "string", default: "/contact"}
          
          - label: "Feature Blocks Section"
            name: "featureBlocks"
            widget: "object"
            fields:
              - {label: "Script Accent", name: "scriptAccent", widget: "string", default: "Your Perfect Venue"}
              - {label: "Section Title", name: "title", widget: "string", default: "Why Choose Rum River Barn"}
              - {label: "Lead Text", name: "lead", widget: "text", default: "Discover what makes our venue the perfect setting for your unforgettable celebration"}
              - label: "Blocks"
                name: "blocks"
                widget: "list"
                fields:
                  - {label: "Number", name: "number", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Lead Text", name: "lead", widget: "string"}
                  - {label: "Content", name: "content", widget: "text"}
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Image Alt", name: "imageAlt", widget: "string"}
                  - {label: "Reverse Layout", name: "reverse", widget: "boolean", default: false}

          - label: "Experience Section"
            name: "experience"
            widget: "object"
            fields:
              - {label: "Script Accent", name: "scriptAccent", widget: "string", default: "The Rum River Experience"}
              - {label: "Title", name: "title", widget: "string", default: "More Than a Venue"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Main Image", name: "image", widget: "image"}
              - label: "Features"
                name: "features"
                widget: "list"
                fields:
                  - {label: "Icon", name: "icon", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}

      - name: "property"
        label: "🏡 Property Page"
        file: "content/pages/property.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string", default: "The Property"}
              - {label: "Description", name: "description", widget: "text", default: "Discover the beautiful spaces and natural settings that make Rum River Barn the perfect venue for your celebration."}
              - {label: "Background Image", name: "backgroundImage", widget: "image"}
          
          - label: "Venue Discovery Section"
            name: "venueDiscovery"
            widget: "object"
            fields:
              - {label: "Script Accent", name: "scriptAccent", widget: "string", default: "Your Perfect Setting"}
              - {label: "Title", name: "title", widget: "string", default: "Discover Our Spaces"}
              - {label: "Description", name: "description", widget: "text", default: "Every corner tells a story, every space creates memories"}
              - {label: "Section Class", name: "sectionClassName", widget: "string", default: "section-warm"}

          - label: "Schedule Tour Section"
            name: "scheduleTour"
            widget: "object"
            fields:
              - {label: "Script Accent", name: "scriptAccent", widget: "string", default: "Ready to Visit?"}
              - {label: "Title", name: "title", widget: "string", default: "Schedule Your Property Tour"}
              - {label: "Description", name: "description", widget: "text", default: "Experience the beauty of Rum River Barn in person. Fill out the form below to schedule a private tour of our property."}

  # Venues Collection - Individual venue spaces
  - name: "venues"
    label: "🏛️ Venue Spaces"
    folder: "content/venues"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Key", name: "key", widget: "string", hint: "Unique identifier (e.g., barn, bridal, groom)"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Order", name: "order", widget: "number", default: 1, hint: "Display order in tabs"}
      - label: "Images"
        name: "images"
        widget: "list"
        field: {label: "Image", name: "image", widget: "image"}
      - label: "Features"
        name: "features"
        widget: "list"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Value", name: "value", widget: "string"}

  # Testimonials Collection
  - name: "testimonials"
    label: "💬 Testimonials"
    folder: "content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Author Name", name: "authorName", widget: "string"}
      - {label: "Author Detail", name: "authorDetail", widget: "string", hint: "e.g., Married October 2024"}
      - {label: "Quote", name: "quote", widget: "text"}
      - {label: "Rating", name: "rating", widget: "number", default: 5, min: 1, max: 5}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - {label: "Order", name: "order", widget: "number", default: 1}

  # Real Weddings Collection
  - name: "weddings"
    label: "💍 Real Weddings"
    folder: "content/weddings"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - {label: "Couple Names", name: "coupleName", widget: "string"}
      - {label: "Wedding Date", name: "weddingDate", widget: "datetime"}
      - {label: "Season", name: "season", widget: "select", options: ["Spring", "Summer", "Fall", "Winter"]}
      - {label: "Location", name: "location", widget: "string", default: "Rum River Wedding Barn • Milaca, MN"}
      - {label: "Cover Image", name: "coverImage", widget: "image"}
      - {label: "Gallery Images", name: "galleryImages", widget: "list", field: {label: "Image", name: "image", widget: "image"}}
      - {label: "Photo Count", name: "photoCount", widget: "number"}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - {label: "Body", name: "body", widget: "markdown", required: false}

# Editor settings
editor:
  preview: true

# Editorial workflow
publish_mode: editorial_workflow