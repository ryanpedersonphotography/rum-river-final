<!doctype html>
<html lang="en">
  <head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-NQP5S8C3');</script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rum River Wedding Barn</title>
    
    <!-- Netlify Identity Widget for email confirmations -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NQP5S8C3"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <script>
      // Handle Netlify Identity redirects (password reset, email confirmation, etc.)
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              // Redirect to admin after login if coming from email
              if (window.location.hash && window.location.hash.includes('token')) {
                document.location.href = "/test-admin.html";
              }
            });
          }
        });
      }
    </script>
    <div id="root"></div>

    <!-- Hidden forms for Netlify Forms detection -->
    <form name="home-schedule-tour" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="date" name="proposedEventDate" />
      <input type="date" name="preferredTourDate" />
      <select name="preferredTourTime">
        <option value="10:00 AM">10:00 AM</option>
        <option value="11:00 AM">11:00 AM</option>
        <option value="1:00 PM">1:00 PM</option>
        <option value="2:00 PM">2:00 PM</option>
        <option value="3:00 PM">3:00 PM</option>
        <option value="4:00 PM">4:00 PM</option>
      </select>
      <select name="guestCount">
        <option value="50-100">50-100 Guests</option>
        <option value="100-150">100-150 Guests</option>
        <option value="150-200">150-200 Guests</option>
        <option value="200+">200+ Guests</option>
      </select>
      <textarea name="message"></textarea>
    </form>

    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="bot-field" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="date" name="eventDate" />
      <select name="guestCount">
        <option value="50-100">50-100 Guests</option>
        <option value="100-150">100-150 Guests</option>
        <option value="150-200">150-200 Guests</option>
        <option value="200+">200+ Guests</option>
      </select>
      <textarea name="message"></textarea>
    </form>

    <form name="schedule-tour" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="date" name="proposedEventDate" />
      <input type="date" name="preferredTourDate" />
      <select name="preferredTourTime">
        <option value="10:00 AM">10:00 AM</option>
        <option value="11:00 AM">11:00 AM</option>
        <option value="1:00 PM">1:00 PM</option>
        <option value="2:00 PM">2:00 PM</option>
        <option value="3:00 PM">3:00 PM</option>
        <option value="4:00 PM">4:00 PM</option>
      </select>
      <select name="guestCount">
        <option value="50-100">50-100 Guests</option>
        <option value="100-150">100-150 Guests</option>
        <option value="150-200">150-200 Guests</option>
        <option value="200+">200+ Guests</option>
      </select>
      <textarea name="message"></textarea>
    </form>

    <form name="vendor-application" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="bot-field" />
      <input type="text" name="businessName" />
      <input type="text" name="contactName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="serviceCategory">
        <option value="">Select Category</option>
        <option value="Photography">Photography</option>
        <option value="Videography">Videography</option>
        <option value="DJ & Entertainment">DJ & Entertainment</option>
        <option value="Catering">Catering</option>
        <option value="Florist">Florist</option>
        <option value="Hair & Makeup">Hair & Makeup</option>
        <option value="Wedding Planning">Wedding Planning</option>
        <option value="Transportation">Transportation</option>
        <option value="Officiants">Officiants</option>
        <option value="Other">Other</option>
      </select>
      <select name="yearsInBusiness">
        <option value="">Select Range</option>
        <option value="Less than 1 year">Less than 1 year</option>
        <option value="1-3 years">1-3 years</option>
        <option value="3-5 years">3-5 years</option>
        <option value="5-10 years">5-10 years</option>
        <option value="10+ years">10+ years</option>
      </select>
      <input type="url" name="website" />
      <input type="text" name="serviceArea" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
