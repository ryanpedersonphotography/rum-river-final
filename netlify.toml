[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # Sanity configuration - set these in Netlify UI
  # SANITY_PROJECT_ID = "vicw6cgb"
  # SANITY_DATASET = "production"
  # SANITY_API_TOKEN = "your-token-here"

# SPA redirects for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    # Allow Sanity Studio to embed site for Presentation Tool (visual editing)
    # X-Frame-Options = "DENY"  # Disabled - using CSP frame-ancestors instead
    Content-Security-Policy = "frame-ancestors 'self' https://*.sanity.studio https://rum-river-final.sanity.studio http://localhost:3333"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"